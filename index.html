<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="referrer" content="strict-origin-when-cross-origin" />

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hagar</title>

<style>
.reel img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* تجعل الصورة تملأ المربع بشكل متناسق */
}



  :root {
    --bg: #14060a;
    --card: #2a0d13;
    --card2: #1d090e;
    --text: #f5e9ea;
    --muted: #b89397;
    --border: #d31f2b;
    --red: #e02430;
    --red-soft: #ff4d5e;
    --chip: #3a1118;
    --glow1: #4a1420;
    --glow2: #1a070c;
    --shadow: rgba(224,36,48,.4);
    --faint: rgba(224,36,48,.25);
  }
  :root[data-theme="blue"] {
    --bg: #060d16; --card: #0d1c2e; --card2: #091422; --muted: #93a7b8;
    --border: #1f6fd3; --red: #2470e0; --red-soft: #4da3ff;
    --chip: #11263f; --glow1: #14345a; --glow2: #070f1a;
    --shadow: rgba(36,112,224,.4); --faint: rgba(36,112,224,.25);
  }
  :root[data-theme="purple"] {
    --bg: #0d0616; --card: #1d0d2e; --card2: #150921; --muted: #a793b8;
    --border: #8a1fd3; --red: #9624e0; --red-soft: #c44dff;
    --chip: #28113f; --glow1: #3a145a; --glow2: #12071a;
    --shadow: rgba(150,36,224,.4); --faint: rgba(150,36,224,.25);
  }
  :root[data-theme="green"] {
    --bg: #06140a; --card: #0d2e18; --card2: #092115; --muted: #93b8a1;
    --border: #1fa34a; --red: #22b455; --red-soft: #4dff8a;
    --chip: #113f22; --glow1: #145a2e; --glow2: #071a0d;
    --shadow: rgba(34,180,85,.4); --faint: rgba(34,180,85,.25);
  }
  :root[data-theme="orange"] {
    --bg: #160c06; --card: #2e1a0d; --card2: #211208; --muted: #b8a793;
    --border: #d3721f; --red: #e07824; --red-soft: #ffa54d;
    --chip: #3f2711; --glow1: #5a3814; --glow2: #1a0f07;
    --shadow: rgba(224,120,36,.4); --faint: rgba(224,120,36,.25);
  }
  :root[data-theme="black"] {
    --bg: #000000; --card: #111111; --card2: #0a0a0a; --muted: #7d7d7d;
    --border: #4a4a4a; --red: #2e2e2e; --red-soft: #c7c7c7;
    --chip: #1d1d1d; --glow1: #2b2b2b; --glow2: #050505;
    --shadow: rgba(255,255,255,.14); --faint: rgba(255,255,255,.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); transition: background .3s, color .3s; padding-bottom: 110px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .card {
      justify-content: center; 
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  /* ===== HERO ===== */
  .hero {  display: flex; align-items: center; gap: 48px; flex-wrap: wrap; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .hero-img-wrap {
    width: 300px; height: 300px; border-radius: 50%;
    border: 3px solid var(--border);
    box-shadow: 0 0 45px var(--shadow), 0 0 14px var(--border);
    background: radial-gradient(circle at 50% 40%, var(--glow1), var(--glow2));
    display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
    flex-shrink: 0;
    animation: floatY 4s ease-in-out infinite;
  }
  .hero-img-wrap img { width: 123%; height: 123%; object-fit: contain; cursor: pointer; transition: transform .3s; }
  .hero-img-wrap img:hover { transform: scale(1.05); }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--chip); border: 1px solid var(--border); color: var(--red-soft);
    padding: 6px 14px; border-radius: 20px; font-size: 13px; margin-bottom: 16px;
    transition: .3s;
  }
  .badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; }
  .badge.online .dot {
    background: #2ecc71;
    box-shadow: 0 0 8px #2ecc71, 0 0 16px rgba(46,204,113,.7);
    animation: pulseGreen 1.6s ease-in-out infinite;
  }
  .badge.online { color: #7ee2a8; border-color: rgba(46,204,113,.5); }
  .badge.offline { color: #ff6b6b; border-color: rgba(255,77,94,.5); }
  .badge.offline .dot {
    background: #ff3b47;
    box-shadow: 0 0 8px #ff3b47;
    animation: none;
  }
  @keyframes pulseGreen {
    0%, 100% { box-shadow: 0 0 6px #2ecc71, 0 0 12px rgba(46,204,113,.6); }
    50%      { box-shadow: 0 0 12px #2ecc71, 0 0 26px rgba(46,204,113,.95); }
  }
  h1 { font-size: 46px;  }
  h1 span, h2 span { color: var(--red-soft); }
  .subtitle { color: var(--red-soft); font-size: 18px; margin: 8px 0 14px; }
  .desc { color: var(--muted); max-width: 420px; line-height: 1.6; }
  .stats { display: flex; gap: 40px; margin: 26px 0; }
  .stat b { font-size: 26px; display: block; }
  .stat small { color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 24px; font-size: 15px; cursor: pointer;
    border: 1.5px solid var(--red); text-decoration: none; transition: .25s;
  }
  .btn-fill { background: var(--red); color: #fff; }
  .btn-fill:hover { background: #b3121d; }
  .btn-outline { background: transparent; color: var(--text); }
  .btn-outline:hover { background: var(--red); color: #fff; }
  .socials { display: flex; gap: 16px; margin-top: 4px; width: 100%; }
  .socials a {
    flex: 1; height: 64px; border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--card2);
    display: flex; align-items: center; justify-content: center;
    color: var(--red-soft); transition: .25s; text-decoration: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .socials a:hover {
    background: var(--red); color: #fff; transform: translateY(-6px);
    box-shadow: 0 10px 24px var(--shadow);
  }
  .socials svg { width: 26px; height: 26px; fill: currentColor; }

  /* ===== NAV ===== */
  .navbar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--red); border-radius: 40px; padding: 10px 28px;
    display: flex; gap: 34px; align-items: center; z-index: 100;
    box-shadow: 0 8px 30px var(--shadow);
  }
  .navbar a {
    color: rgba(255,255,255,.85); text-decoration: none; font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; transition: .2s;
  }
  .navbar a:hover, .navbar a.active { color: #fff; transform: translateY(-3px); }
  .navbar svg { width: 20px; height: 20px; fill: currentColor; }
  #themeBtn {
    position: absolute; top: -16px; right: -6px; width: 34px; height: 34px;
    border-radius: 50%; border: none; background: #fff; color: var(--red);
    cursor: pointer; font-size: 16px; box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }

  /* ===== SECTIONS ===== */
  h2 { font-size: 28px; text-align: center; margin-bottom: 6px; }
  .section-sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }

  .circle-img {
    width: 150px; height: 150px; border-radius: 50%; overflow: hidden;
    border: 3px solid var(--border); background: var(--red); flex-shrink: 0;
    box-shadow: 0 0 28px var(--shadow), 0 0 8px var(--border);
    animation: floatY 3.5s ease-in-out infinite;
    animation-delay: .5s;
  }
  .circle-img img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform .3s; }
  .circle-img img:hover { transform: scale(1.08); }
  .about-box { display: flex; align-items: center; gap: 32px; }

  /* ===== MUSIC PLAYER ===== */
  .player {
    background: linear-gradient(145deg, var(--card2), var(--chip));
    border: 1px solid var(--faint); border-radius: 18px; padding: 20px; margin-bottom: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 28px rgba(0,0,0,.35);
  }
  .now-playing { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex-shrink: 0; }
  .eq span {
    width: 4px; height: 25%; border-radius: 2px; background: var(--red-soft);
    box-shadow: 0 0 6px var(--red-soft);
    animation: eqBounce 1s ease-in-out infinite; animation-play-state: paused;
  }
  .eq span:nth-child(2) { animation-delay: .15s; }
  .eq span:nth-child(3) { animation-delay: .3s; }
  .eq span:nth-child(4) { animation-delay: .45s; }
  .eq span:nth-child(5) { animation-delay: .6s; }
  .player.playing .eq span { animation-play-state: running; }
  @keyframes eqBounce { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  .np-text {   justify-content: center;  flex: 1; min-width: 0; }
  .np-title {   justify-content: center;  display: flex; align-items: center; gap: 14px;  justify-content: center;  font-size: 15px; font-weight: 600; color: var(--red-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-sub { justify-content: center;  display: flex; align-items: center; gap: 14px;  justify-content: center; font-size: 11px; color: var(--muted); }
  .controls {   justify-content: center;  display: flex; align-items: center; gap: 14px;  justify-content: center;  }
  
  .controls .side {
    
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; cursor: pointer; transition: .2s;
    border: none; background: var(--red); color: #fff;
    box-shadow: 0 4px 14px var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .controls .side:hover { transform: scale(1.12); box-shadow: 0 6px 18px var(--shadow); }
  .controls button svg { width: 17px; height: 17px; fill: currentColor; display: block; }
  #playBtn {
    width: 54px; height: 54px; border-radius: 50%; border: none; flex-shrink: 0; cursor: pointer;
    background: linear-gradient(145deg, var(--red-soft), var(--red)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px var(--shadow), inset 0 1px 0 rgba(255,255,255,.25);
    transition: .2s;
  }
  #playBtn svg { width: 22px; height: 22px; }
  #playBtn:hover { transform: scale(1.08); box-shadow: 0 8px 26px var(--shadow), inset 0 1px 0 rgba(255,255,255,.25); }
  .time-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .time { font-size: 11px; color: var(--muted); min-width: 36px; font-variant-numeric: tabular-nums; }
  .time.total { text-align: right; }
  .progress { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); cursor: pointer; position: relative; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, var(--red), var(--red-soft)); box-shadow: 0 0 8px var(--shadow); transition: width .12s linear; }
  .vol-wrap { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); }
  .vol-wrap svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; flex: 1; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; margin-top: -4.5px;
    background: var(--red-soft); box-shadow: 0 0 8px var(--red-soft);
  }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--red-soft); box-shadow: 0 0 8px var(--red-soft); }
  .track-list { margin-bottom: 16px; max-height: 240px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--red) transparent; }
  .track-list::-webkit-scrollbar { width: 8px; }
  .track-list::-webkit-scrollbar-track { background: transparent; }
  .track-list::-webkit-scrollbar-thumb { background: var(--red); border-radius: 4px; }
  .track-list::-webkit-scrollbar-thumb:hover { background: var(--red-soft); }
  .track {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-bottom: 1px dashed var(--faint);
    font-size: 14px; cursor: pointer; border-radius: 8px; transition: .2s;
  }
  .track:hover, .track.active { background: var(--chip); color: var(--red-soft); }
  .track .num { color: var(--muted); font-size: 12px; min-width: 18px; }
  .track .t-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== REELS SLIDER ===== */
  .reels-wrap { position: relative; }
  .reels-grid {
    display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 4px; scrollbar-width: none;
  }
  .reels-grid::-webkit-scrollbar { display: none; }
  .reel {
    flex: 0 0 180px; aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden;
    border: 1.5px solid var(--border); box-shadow: 0 0 18px var(--shadow);
    scroll-snap-align: start;
  }
  @media (max-width: 800px) { .reel { flex-basis: 150px; } }
  .reel img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; transition: transform .3s; }
  .reel img:hover { transform: scale(1.06); }
  .reel-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--red); color: #fff; font-size: 15px; cursor: pointer; transition: .2s;
  }
  .reel-nav:hover { box-shadow: 0 4px 14px var(--shadow); transform: translateY(-50%) scale(1.12); }
  #reelPrev { left: 2px; }
  #reelNext { right: 2px; }

  .hint {
    position: absolute; top: 12px; right: 16px; font-size: 11px;
    color: var(--red-soft); background: var(--faint);
    padding: 4px 10px; border-radius: 12px;
  }

  /* ===== EDIT MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: min(480px, 92vw); text-align: center;
  }
  .modal h3 { margin-bottom: 16px; }
  .modal img {
    width: 100%; max-height: 320px; object-fit: contain;
    border-radius: 10px; background: var(--card2); margin-bottom: 16px;
  }
  .modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .modal.viewer { width: min(560px, 92vw); position: relative; }
  .modal.viewer img { margin-bottom: 0; }
  .video-modal { width: min(720px, 94vw); position: relative; }
  .video-wrap { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .video-wrap iframe { width: 100%; height: 100%; border: 0; }
  .x-btn {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: var(--red); color: #fff;
    font-size: 14px; cursor: pointer; z-index: 2; transition: .2s;
  }
  .x-btn:hover { transform: scale(1.12); box-shadow: 0 4px 12px var(--shadow); }

  /* ===== SNOW EFFECT ===== */
  .snowflake {
    position: absolute; border-radius: 50%;
    background: var(--red-soft);
    box-shadow: 0 0 8px var(--red-soft), 0 0 3px var(--red-soft);
    pointer-events: none; z-index: 5;
    animation: snowUp linear forwards;
  }
  @keyframes snowUp {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    12%  { opacity: .95; }
    70%  { opacity: .7; }
    100% { transform: translate(var(--dx), -240px) scale(.3); opacity: 0; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- HERO -->
  <section id="home" class="card hero">
    <div class="hero-img-wrap">
      <img data-edit="avatar-main" src="https://xatimg.com/image/uaxC7zxetCKJ.jpg" alt="Charlotte">
    </div>
    <div>
      <span class="badge online" id="statusBadge"><span class="dot"></span><span id="statusText">Available for work</span></span>
      <h1> HAGAR <span></span></h1>
      <div class="stats">
        <div class="stat"><b>ixiaHagerixG 1561221665</b><small></small></div>
      </div>
      <div class="socials">
        <a href="#" title="Facebook" aria-label="Facebook">
          <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>

        </a>
      </div>
    </div>
  </section>

  <div class="split">
    <!-- ABOUT -->
    <section class="card about-box">
      <div class="circle-img"><img data-edit="avatar-main-2" src="https://xatimg.com/image/99Qo0u1GYfAP.jpg" alt="Charlotte"></div>
      <div>
        <h2 style="text-align:left"><span></span></h2>
        <div class="subtitle" style="font-size:14px"></div>
        <p class="desc" style="font-size:13px"></p>
      </div>
    </section>

    <!-- ABOUT 2 -->
    <section class="card about-box">
      <div class="circle-img"><img data-edit="avatar-main-2" src="https://xatimg.com/image/m5CsHb8qvQZ1.jpg" alt="Charlotte"></div>
      <div>
        <h2 style="text-align:left"><span></span></h2>
        <div class="subtitle" style="font-size:14px"></div>
        <p class="desc" style="font-size:13px"></p>
      </div>
    </section>
 </div>
  <!-- SONGS -->
  <section id="songs" class="card">
    <h2>My <span>Songs</span></h2>
    <p class="section-sub">Add your MP3 tracks and play them right here.</p>

    <div class="player" id="player">
      <div class="now-playing">
        <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="np-text">
          <div class="np-title" id="nowPlaying">Nothing playing</div>
          <div class="np-sub" id="npSub">Pick a song from the list</div>
        </div>
      </div>
      <audio id="audio" preload="auto"></audio>
      <div class="controls">
        <button type="button" class="side" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        </button>
        <button type="button" id="playBtn" title="Play / Pause">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" id="pauseIcon" style="display:none"><path d="M6.5 5h3.5v14H6.5zM14 5h3.5v14H14z"/></svg>
        </button>
        <button type="button" class="side" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
        </button>
      </div>
      <div class="time-row">
        <span class="time" id="timeEl">0:00</span>
        <div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time total" id="durEl">0:00</span>
      </div>
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <input type="range" id="volRange" min="0" max="100" value="80">
      </div>
    </div>

    <div class="track-list" id="trackList">
      
    </div>
  </section>


<!-- NAV BAR -->
<nav class="navbar">
  <button id="themeBtn" title="Toggle theme">&#9788;</button>
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>Home</a>
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>About</a>
  <a href="#songs"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>Songs</a>
  <a href="#projects"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg>Reels</a>
</nav>

<!-- IMAGE VIEWER -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal viewer">
    <button class="x-btn" id="closeBtn" title="Close">&#10005;</button>
    <img id="modalImg" src="" alt="preview">
  </div>
</div>

<!-- VIDEO PLAYER -->
<div class="modal-overlay" id="videoOverlay">
  <div class="modal video-modal">
    <button class="x-btn" id="videoCloseBtn" title="Close">&#10005;</button>
    <div class="video-wrap"><iframe id="videoFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
  </div>
</div>

<script>
  /* ---------- Theme cycle ---------- */
  const THEMES = [
    { name: 'red',    icon: '🔴' },
    { name: 'blue',   icon: '🔵' },
    { name: 'purple', icon: '🟣' },
    { name: 'green',  icon: '🟢' },
    { name: 'orange', icon: '🟠' },
    { name: 'black',  icon: '⚫' },
  ];
  let themeIndex = Math.max(0, THEMES.findIndex(t => t.name === localStorage.getItem('theme')));

  function hexToHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255,
          g = parseInt(hex.slice(3, 5), 16) / 255,
          b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0;
    const l = (max + min) / 2, d = max - min;
    if (d) {
      h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return { h: Math.round(h), s: Math.round(d ? (d / (1 - Math.abs(2 * l - 1))) * 100 : 0) };
  }

  function applyTheme() {
    const t = THEMES[themeIndex];
    document.documentElement.dataset.theme = t.name === 'red' ? '' : t.name;
    localStorage.setItem('theme', t.name);
    document.getElementById('themeBtn').textContent = t.icon;
    document.getElementById('themeBtn').title = 'Theme: ' + t.name + ' (click to change)';
    retintProjects();
  }

  document.getElementById('themeBtn').addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % THEMES.length;
    applyTheme();
  });

  function buildReelPlaceholder(i) {
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--red').trim() || '#e02430';
    const { h, s } = hexToHsl(accent);
    const S = Math.min(s, 65);
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='270' height='480'>
      <rect width='270' height='480' fill='hsl(${h},${S}%,20%)'/>
      <circle cx='135' cy='215' r='44' fill='hsl(${h},${S}%,32%)'/>
      <path d='M121 192 l46 23 -46 23 z' fill='#fff' opacity='.85'/>
      <rect x='24' y='420' width='130' height='12' rx='6' fill='hsl(${h},${S}%,32%)'/>
      <rect x='24' y='442' width='85' height='10' rx='5' fill='hsl(${h},${S}%,28%)'/>
      <text x='135' y='60' fill='#fff' font-size='20' font-family='Arial' text-anchor='middle' opacity='.7'>Reel ${i + 1}</text>
    </svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  function retintProjects() {
    document.querySelectorAll('img[data-edit^="reel-"]').forEach((img, i) => {
      const key = 'img-' + img.dataset.edit;
      if (localStorage.getItem(key)) return; // keep user's uploaded image
      img.src = buildReelPlaceholder(i);
    });
  }

  /* ---------- Image viewer ---------- */
  const overlay  = document.getElementById('modalOverlay');
  const modalImg = document.getElementById('modalImg');


function openVideo(id) {
  if (videoFrame && videoOverlay) {
    // إرسال طلب التشغيل مع إجبار إرسال الـ Referrer ليقبل يوتيوب التضمين
    videoFrame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    videoFrame.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
    videoOverlay.classList.add('open');
  }
}

  
  /* ---------- YouTube reels config ---------- */
  // ضيف ريلز براحتك — كل سطر = ريل جديد في السلايدر
  const YOUTUBE_REELS = [
    { key: 'reel-1', url: 'https://www.youtube.com/shorts/Y3b05AdDpS8' },  // قولي غاب مش فاكرة شكله
    { key: 'reel-2', url: 'https://youtube.com' },  // على عيني - أحمد كامل
    { key: 'reel-3', url: '' },
    { key: 'reel-4', url: '' },
  ];

  /* ---------- YouTube reels player ---------- */
  const videoOverlay = document.getElementById('videoOverlay');
  const videoFrame   = document.getElementById('videoFrame');

  function extractVideoId(u) {
    if (!u) return null;
    // Regex مطور ليلتقط الروابط بجميع أشكالها (بـ https:// أو بدونها)
    const m = String(u).match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) return m[1];
    return /^[\w-]{11}$/.test(u) ? u : null;
  }

  function openVideo(id) {
    videoFrame.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
    videoOverlay.classList.add('open');
  }
  
  function closeVideo() {
    videoFrame.src = '';
    videoOverlay.classList.remove('open');
  }

  // Build reel cards from the config list
  const reelsGrid = document.getElementById('reelsGrid');
  if (reelsGrid) {
    reelsGrid.innerHTML = ''; // تنظيف السلايدر أولاً لمنع التكرار
    
    YOUTUBE_REELS.forEach((r, i) => {
      const div = document.createElement('div');
      div.className = 'reel';
      
      const img = document.createElement('img');
      img.dataset.edit = r.key;
      img.alt = 'Reel ' + (i + 1);
      img.src = buildReelPlaceholder(i);
      img.title = 'Play reel';
      
      // ربط حدث الضغط مباشرة عند إنشاء الصورة لضمان عمله 100%
      img.addEventListener('click', () => {
        const vid = extractVideoId(r.url);
        if (vid) {
          openVideo(vid);
        } else { 
          // إذا لم يجد رابطاً، يعرض الصورة الافتراضية في الـ البوب أب العادي
          if (typeof modalImg !== 'undefined' && typeof overlay !== 'undefined') {
            modalImg.src = img.src;
            overlay.classList.add('open'); 
          }
        }
      });

      div.appendChild(img);
      reelsGrid.appendChild(div);
    });
  }

  // Slider arrows
  const prevBtn = document.getElementById('reelPrev');
  const nextBtn = document.getElementById('reelNext');
  if (prevBtn) prevBtn.addEventListener('click', () => reelsGrid.scrollBy({ left: -200, behavior: 'smooth' }));
  if (nextBtn) nextBtn.addEventListener('click', () => reelsGrid.scrollBy({ left: 200, behavior: 'smooth' }));

  // View any image in a popup (avatars, items other than reels)
  document.querySelectorAll('img[data-edit]').forEach(img => {
    // تفعيل التكبير فقط للصور التي لا تنتمي للريلز
    if (img.dataset.edit.startsWith('reel-')) return; 
    
    img.title = 'Click to view';
    img.addEventListener('click', () => {
      if (typeof modalImg !== 'undefined' && typeof overlay !== 'undefined') {
        modalImg.src = img.src;
        overlay.classList.add('open');
      }
    });
  });

  const closeBtn = document.getElementById('closeBtn');
  if (closeBtn) closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  
  if (typeof overlay !== 'undefined' && overlay) {
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
  }

  const videoCloseBtn = document.getElementById('videoCloseBtn');
  if (videoCloseBtn) videoCloseBtn.addEventListener('click', closeVideo);
  if (videoOverlay) videoOverlay.addEventListener('click', e => { if (e.target === videoOverlay) closeVideo(); });

  /* ---------- Active nav highlight ---------- */
  const sections = ['home', 'songs', 'projects'];
  window.addEventListener('scroll', () => {
    let current = 'home';
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top < window.innerHeight / 2) current = id;
    });
    document.querySelectorAll('.navbar a').forEach(a =>
      a.classList.toggle('active', a.getAttribute('href') === '#' + current));
  });
  /* ---------- Online / Offline status ---------- */
  // من غير مصدر خارجي: الحالة بتعكس اتصال المتصفح نفسه
  const statusBadge = document.getElementById('statusBadge');
  const statusText  = document.getElementById('statusText');

  function setStatus(online) {
    statusBadge.classList.toggle('online', online);
    statusBadge.classList.toggle('offline', !online);
    statusText.textContent = online ? 'Online' : 'Offline';
  }

  function checkStatus() {
    setStatus(navigator.onLine && document.visibilityState === 'visible');
  }

  checkStatus();
  setInterval(checkStatus, 30000);
  window.addEventListener('online', checkStatus);
  window.addEventListener('offline', checkStatus);
  document.addEventListener('visibilitychange', checkStatus);

  /* ---------- Music player ---------- */
  // ضيف أغانيك الأونلاين هنا — الرابط المباشر لملف MP3 (استبدل الأسماء والروابط براحتك)
  const ONLINE_SONGS = [
    { 
      name: 'Sherine - Kolly Melkak', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/Sherine - Kolly Melkak.mp3' 
      
    },

    {name: 'مطمنه - انغام', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/مطمنه - انغام.mp3' },
    // باقي الأغاني...
    {
      name: 'Mohammed Fouad...Khabini', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/Mohammed Fouad...Khabini.mp3'
    },
    {
name: 'Jannat  K2nak Roh', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/Jannat  K2nak Roh.mp3'

    },

    {

      name: 'Tamer Hosny Hobak Law Ghalta', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/Tamer Hosny Hobak Law Ghalta.mp3' },


      {

      name: 'Amal Maher Madmouna', 
      url: 'file:///C:/Users/Yasser/Documents/Qoder/2026-10-31/5d3479fa/assets/Amal Maher Madmouna.mp3' },
    
];

  const playerEl   = document.getElementById('player');
  const audio      = document.getElementById('audio');
  const playBtn    = document.getElementById('playBtn');
  const progressBar  = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const nowPlayingEl = document.getElementById('nowPlaying');
  const npSub      = document.getElementById('npSub');
  const timeEl     = document.getElementById('timeEl');
  const durEl      = document.getElementById('durEl');
  const trackListEl  = document.getElementById('trackList');
  let tracks = [];   // {id, name, url}
  let current = -1;

  tracks = ONLINE_SONGS.map((s, i) => ({ id: 'online-' + i, name: s.name, url: s.url }));
  renderTracks();

  function renderTracks() {
    trackListEl.innerHTML = '';
    if (!tracks.length) {
      const empty = document.createElement('p');
      empty.className = 'section-sub';
      empty.style.margin = '6px 0 0';
      empty.textContent = 'No songs in the playlist yet.';
      trackListEl.appendChild(empty);
      return;
    }
    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track' + (i === current ? ' active' : '');
      const num = document.createElement('span');
      num.className = 'num'; num.textContent = i + 1;
      const name = document.createElement('span');
      name.className = 't-name'; name.textContent = t.name;
      row.append(num, name);
      row.addEventListener('click', () => playTrack(i));
      trackListEl.appendChild(row);
    });
  }

  const playIcon  = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  function showPlayIcon(playing) {
    playIcon.style.display = playing ? 'none' : '';
    pauseIcon.style.display = playing ? '' : 'none';
  }

  function playTrack(i) {
    if (!tracks.length) return;
    current = i;
    audio.src = tracks[i].url;
    audio.play();
    nowPlayingEl.textContent = tracks[i].name;
    npSub.textContent = 'Now playing · Track ' + (i + 1) + ' of ' + tracks.length;
    showPlayIcon(true);
    playerEl.classList.add('playing');
    renderTracks();
  }

  function stopPlayback() {
    audio.pause();
    current = -1;
    nowPlayingEl.textContent = 'Nothing playing';
    npSub.textContent = 'Pick a song from the list';
    showPlayIcon(false);
    playerEl.classList.remove('playing');
    progressFill.style.width = '0%';
    timeEl.textContent = '0:00';
    durEl.textContent = '0:00';
    renderTracks();
  }

  playBtn.addEventListener('click', () => {
    if (current === -1) { playTrack(0); return; }
    if (audio.paused) { audio.play(); showPlayIcon(true); playerEl.classList.add('playing'); }
    else { audio.pause(); showPlayIcon(false); playerEl.classList.remove('playing'); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => tracks.length && playTrack((current + 1) % tracks.length));
  document.getElementById('prevBtn').addEventListener('click', () => tracks.length && playTrack((current - 1 + tracks.length) % tracks.length));
  audio.addEventListener('ended', () => tracks.length && playTrack((current + 1) % tracks.length));

  function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    timeEl.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration || 0); });
  progressBar.addEventListener('click', e => {
    if (!audio.duration) return;
    audio.currentTime = (e.offsetX / progressBar.offsetWidth) * audio.duration;
  });

  // Volume control (persisted)
  const volRange = document.getElementById('volRange');
  const savedVol = parseInt(localStorage.getItem('vol') ?? '80', 10);
  audio.volume = savedVol / 100;
  volRange.value = savedVol;
  volRange.addEventListener('input', () => {
    audio.volume = volRange.value / 100;
    localStorage.setItem('vol', volRange.value);
  });

  /* ---------- Snow effect (all circular images) ---------- */
  const snowSources = [
    document.querySelector('.hero-img-wrap'),
    ...document.querySelectorAll('.circle-img'),
  ].filter(Boolean);

  function spawnFlakeFrom(src) {
    const host = src.closest('.card') || document.body;
    const flake = document.createElement('span');
    flake.className = 'snowflake';
    const size = 3 + Math.random() * 6;
    flake.style.width = flake.style.height = size + 'px';
    flake.style.left = (src.offsetLeft + src.offsetWidth / 2 + (Math.random() - 0.5) * src.offsetWidth * 0.8) + 'px';
    flake.style.top = (src.offsetTop + src.offsetHeight * 0.35) + 'px';
    flake.style.setProperty('--dx', ((Math.random() - 0.5) * 140) + 'px');
    flake.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    host.appendChild(flake);
    flake.addEventListener('animationend', () => flake.remove());
  }

  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => {
      snowSources.forEach(s => { if (Math.random() < 0.45) spawnFlakeFrom(s); });
    }, 170);
  }

  /* ---------- Init theme ---------- */
  applyTheme();
</script>
